<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0b0d12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Coolbox Catalog" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon.svg" />
<title>Coolbox Catalog</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,sans-serif;color:#f6f7fb;background:#090b10;color-scheme:dark;--bg:#090b10;--panel:#11151d;--panel2:#171c26;--line:#242b38;--muted:#8f99aa;--accent:#4f8cff;--good:#6fe0a4;--bad:#ff8d99;--nav:78px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;background:var(--bg);min-height:100vh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));overscroll-behavior-y:none}button,input,select{font:inherit}.appbar{position:sticky;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(9,11,16,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06)}.barrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.apptitle{font-size:21px;font-weight:800;letter-spacing:-.025em}.subtitle{font-size:11px;color:var(--muted);margin-top:2px}.iconbtn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);color:#fff;display:grid;place-items:center;font-size:20px}.searchwrap{margin-top:12px;display:flex;gap:9px}.search{flex:1;position:relative}.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:#fff;padding:0 14px 0 42px;outline:none}.search:before{content:'⌕';position:absolute;left:15px;top:8px;font-size:25px;color:var(--muted)}.filterbtn{height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:#fff;font-weight:700}.content{max-width:1180px;margin:auto;padding:14px}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#dce2ed;border-radius:999px;padding:8px 12px;font-size:12px}.chip.active{background:#eaf1ff;color:#0b0d12;border-color:#eaf1ff}.overview{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:7px 0 14px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px}.metric b{display:block;font-size:21px;letter-spacing:-.03em}.metric span{color:var(--muted);font-size:11px}.sectiontitle{display:flex;justify-content:space-between;align-items:end;margin:12px 2px 10px}.sectiontitle h2{font-size:18px;margin:0}.count{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr;gap:12px}.card{display:grid;grid-template-columns:124px 1fr;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;min-height:170px}.imagebox{background:#fff;display:grid;place-items:center;min-height:170px}.imagebox img{width:100%;height:100%;object-fit:contain;padding:10px}.fallback{color:#7b8492;font-size:13px}.cardbody{padding:13px;display:flex;flex-direction:column;min-width:0}.brand{font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.name{font-size:15px;font-weight:750;line-height:1.25;margin:5px 0 8px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.price{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}.price strong{font-size:20px}.old{font-size:12px;text-decoration:line-through;color:#737d8d}.discount{font-size:10px;border:1px solid #34415a;border-radius:999px;padding:3px 6px}.pill{margin-top:7px;display:inline-flex;width:max-content;border-radius:999px;padding:4px 7px;font-size:10px}.ok{background:#0f3928;color:var(--good)}.no{background:#3b1a20;color:var(--bad)}.meta{font-size:10px;color:var(--muted);margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{margin-top:auto;padding-top:9px}.actions a{display:block;text-align:center;text-decoration:none;background:#eef3ff;color:#0a0c12;border-radius:11px;padding:9px;font-size:12px;font-weight:800}.bottomnav{position:fixed;z-index:40;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:8px 16px env(safe-area-inset-bottom);background:rgba(13,16,22,.95);backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(3,1fr)}.navitem{border:0;background:transparent;color:#8994a6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px}.navitem .ico{font-size:21px}.navitem.active{color:#fff}.sheetback{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none}.sheetback.open{display:block}.sheet{position:absolute;left:0;right:0;bottom:0;background:#12161f;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;animation:up .22s ease}.grab{width:42px;height:5px;border-radius:999px;background:#3a4351;margin:0 auto 16px}.sheet h3{margin:0 0 14px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--muted);margin:0 0 6px 2px}.field select{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:#fff;padding:0 12px}.sheetactions{display:grid;grid-template-columns:1fr 2fr;gap:9px;margin-top:16px}.sheetactions button{height:48px;border-radius:14px;border:1px solid var(--line);font-weight:800}.clear{background:var(--panel2);color:#fff}.apply{background:#eef3ff;color:#0b0d12}.empty{text-align:center;color:var(--muted);padding:60px 20px}.loadmore{display:block;margin:20px auto;border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:13px;padding:11px 18px}.install{margin:14px 0 2px;background:linear-gradient(135deg,#18233b,#141925);border:1px solid #2d3a54;border-radius:18px;padding:14px;display:none;align-items:center;justify-content:space-between;gap:12px}.install.show{display:flex}.install b{display:block;font-size:13px}.install span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.install button{border:0;border-radius:11px;background:#eef3ff;color:#0b0d12;font-weight:800;padding:9px 12px}.hidden{display:none!important}@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}@media(min-width:680px){body{padding-bottom:20px}.bottomnav{display:none}.content{padding:22px}.overview{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.card{grid-template-columns:150px 1fr}.imagebox{min-height:190px}.appbar{padding-left:max(22px,calc((100vw - 1180px)/2));padding-right:max(22px,calc((100vw - 1180px)/2))}}@media(min-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="appbar"><div class="barrow"><div><div class="apptitle">Coolbox Catalog</div><div class="subtitle" id="updated">Cargando catálogo…</div></div><button class="iconbtn" id="refresh" aria-label="Actualizar">↻</button></div><div class="searchwrap"><div class="search"><input id="q" placeholder="Buscar producto, SKU o marca" autocomplete="off"></div><button class="filterbtn" id="openFilters">Filtros</button></div></header>
<main class="content"><div class="chips"><button class="chip active" data-stock="">Todos</button><button class="chip" data-stock="yes">Con stock</button><button class="chip" data-stock="no">Sin stock</button></div><section class="overview"><div class="metric"><b id="total">0</b><span>productos</span></div><div class="metric"><b id="instock">0</b><span>con stock</span></div><div class="metric"><b id="coverage">0%</b><span>cobertura</span></div><div class="metric"><b id="rescued">0</b><span>rescatados V2</span></div></section><div class="install" id="installBox"><div><b>Instalar como app</b><span>Ábrela desde tu pantalla de inicio.</span></div><button id="installBtn">Instalar</button></div><div class="sectiontitle"><h2>Productos</h2><span class="count" id="visible">0 resultados</span></div><section id="grid" class="grid"></section><div id="empty" class="empty hidden">No encontré productos con esos filtros.</div><button id="more" class="loadmore hidden">Mostrar más</button></main>
<nav class="bottomnav"><button class="navitem active" id="navHome"><span class="ico">⌂</span><span>Inicio</span></button><button class="navitem" id="navSearch"><span class="ico">⌕</span><span>Buscar</span></button><button class="navitem" id="navFilters"><span class="ico">☷</span><span>Filtros</span></button></nav>
<div class="sheetback" id="sheetBack"><div class="sheet"><div class="grab"></div><h3>Filtros y orden</h3><div class="field"><label>Marca</label><select id="brand"><option value="">Todas las marcas</option></select></div><div class="field"><label>Categoría</label><select id="category"><option value="">Todas las categorías</option></select></div><div class="field"><label>Disponibilidad</label><select id="stock"><option value="">Todo el stock</option><option value="yes">Con stock</option><option value="no">Sin stock</option></select></div><div class="field"><label>Ordenar</label><select id="sort"><option value="name">Nombre</option><option value="priceAsc">Precio: menor a mayor</option><option value="priceDesc">Precio: mayor a menor</option></select></div><div class="sheetactions"><button class="clear" id="clearFilters">Limpiar</button><button class="apply" id="applyFilters">Aplicar filtros</button></div></div></div>
<script>
const $=s=>document.querySelector(s);let products=[],filtered=[],shown=0,deferredPrompt=null;const STEP=80;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const money=n=>Number.isFinite(+n)&&+n>0?`S/ ${(+n).toFixed(2)}`:'Consultar';const firstCategory=v=>String(v||'').split('|').map(x=>x.trim()).filter(Boolean).pop()||'Sin categoría';
function card(p){const img=p.image?`<img loading="lazy" src="${esc(p.image)}" alt="${esc(p.name||'Producto')}" onerror="this.parentElement.innerHTML='<span class=&quot;fallback&quot;>Sin imagen</span>'">`:`<span class="fallback">Sin imagen</span>`;const d=(+p.listPrice>+p.price&&+p.price>0)?Math.round((1-(+p.price/+p.listPrice))*100):0;return `<article class="card"><div class="imagebox">${img}</div><div class="cardbody"><div class="brand">${esc(p.brand||'Coolbox')}</div><div class="name">${esc(p.name||'Producto sin nombre')}</div><div class="price"><strong>${money(p.price)}</strong>${+p.listPrice>+p.price?`<span class="old">${money(p.listPrice)}</span>`:''}${d?`<span class="discount">-${d}%</span>`:''}</div><span class="pill ${p.available?'ok':'no'}">${p.available?`En stock${p.stock!=null?` · ${esc(p.stock)}`:''}`:'Sin stock'}</span><div class="meta">SKU: ${esc(p.sku||'—')} · ${esc(firstCategory(p.category))}</div><div class="actions"><a href="${esc(p.url||'#')}" target="_blank" rel="noopener noreferrer">Ver en Coolbox</a></div></div></article>`}
function render(reset=true){if(reset){shown=0;const q=$('#q').value.trim().toLowerCase(),brand=$('#brand').value,category=$('#category').value,stock=$('#stock').value;filtered=products.filter(p=>{const hay=`${p.name||''} ${p.sku||''} ${p.brand||''}`.toLowerCase();return(!q||hay.includes(q))&&(!brand||p.brand===brand)&&(!category||firstCategory(p.category)===category)&&(!stock||(stock==='yes'?p.available:!p.available));});const sort=$('#sort').value;filtered.sort((a,b)=>sort==='priceAsc'?(+a.price||1e99)-(+b.price||1e99):sort==='priceDesc'?(+b.price||-1)-(+a.price||-1):String(a.name||'').localeCompare(String(b.name||''),'es'));$('#grid').innerHTML='';}const batch=filtered.slice(shown,shown+STEP);$('#grid').insertAdjacentHTML('beforeend',batch.map(card).join(''));shown+=batch.length;$('#visible').textContent=`${filtered.length.toLocaleString('es-PE')} resultados`;$('#empty').classList.toggle('hidden',filtered.length>0);$('#more').classList.toggle('hidden',shown>=filtered.length)}
function initFilters(){const brands=[...new Set(products.map(p=>p.brand).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));const cats=[...new Set(products.map(p=>firstCategory(p.category)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));$('#brand').insertAdjacentHTML('beforeend',brands.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(''));$('#category').insertAdjacentHTML('beforeend',cats.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(''))}
function load(){fetch('./data/catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('No se pudo cargar el catálogo');return r.json()}).then(d=>{products=d.products||[];const s=d.summary||{};if($('#brand').options.length===1)initFilters();$('#total').textContent=products.length.toLocaleString('es-PE');$('#instock').textContent=products.filter(p=>p.available).length.toLocaleString('es-PE');$('#rescued').textContent=Number(s['Productos rescatados V2']||0).toLocaleString('es-PE');$('#coverage').textContent=`${s['Cobertura sobre URLs %']||0}%`;const when=s['Fin UTC']||products[0]?.updated;$('#updated').textContent=when?`Actualizado ${new Date(when).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'})}`:'Sin actualización';render(true)}).catch(e=>{$('#grid').innerHTML=`<div class="empty">${esc(e.message)}</div>`;$('#updated').textContent='Catálogo no disponible'})}
const sheet=$('#sheetBack');const openSheet=()=>sheet.classList.add('open');const closeSheet=()=>sheet.classList.remove('open');$('#openFilters').onclick=openSheet;$('#navFilters').onclick=openSheet;sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});$('#applyFilters').onclick=()=>{render(true);closeSheet()};$('#clearFilters').onclick=()=>{$('#brand').value='';$('#category').value='';$('#stock').value='';$('#sort').value='name';document.querySelectorAll('.chip').forEach((c,i)=>c.classList.toggle('active',i===0));render(true)};$('#q').addEventListener('input',()=>render(true));$('#more').onclick=()=>render(false);$('#refresh').onclick=()=>load();$('#navSearch').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>$('#q').focus(),250)};$('#navHome').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));ch.classList.add('active');$('#stock').value=ch.dataset.stock;render(true)});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBox').classList.add('show')});$('#installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#installBox').classList.remove('show')};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});load();
</script>
</body></html>
